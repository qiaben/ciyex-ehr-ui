name: Deploy to Stage

on:
  push:
    branches:
      - stage
  pull_request:
    branches:
      - stage
  workflow_dispatch:

env:
  REGISTRY: ${{ secrets.REGISTRY_URL }}
  IMAGE_NAME: ciyex-ehr-ui-stage
  VERSION: v1.0.${{ github.run_number }}

jobs:
  pr-checks:
    name: PR Checks - Validate Build
    if: github.event_name == 'pull_request'
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image (no push)
        run: |
          docker build -t $REGISTRY/$IMAGE_NAME:$VERSION .
          echo "✅ PR image build successful: $REGISTRY/$IMAGE_NAME:$VERSION"

  deploy-stage:
    name: Deploy to Stage
    if: github.ref == 'refs/heads/stage' && github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64]
    environment:
      name: stage
      url: https://stg.ciyex.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Registry
        run: |
          echo "${{ secrets.PROD_REGISTRY_PASSWORD }}" | docker login $REGISTRY -u ${{ secrets.PROD_REGISTRY_USERNAME }} --password-stdin

      - name: Build and Push Docker Image
        run: |
          docker build -t $REGISTRY/$IMAGE_NAME:$VERSION .
          docker push $REGISTRY/$IMAGE_NAME:$VERSION
          echo "✅ Image pushed: $REGISTRY/$IMAGE_NAME:$VERSION"

      - name: Update manifest image tags for deployment
        run: |
          sed -i "s|newName: IMAGE_URL|newName: $REGISTRY/$IMAGE_NAME|g" k8s/overlays/stage/kustomization.yaml
          sed -i "s|newTag: IMAGE_TAG|newTag: $VERSION|g" k8s/overlays/stage/kustomization.yaml

      - name: Create registry pull secret
        run: |
          kubectl config use-context kube-stage
          kubectl create secret docker-registry regcred \
            --docker-server=$REGISTRY \
            --docker-username=${{ secrets.PROD_REGISTRY_USERNAME }} \
            --docker-password=${{ secrets.PROD_REGISTRY_PASSWORD }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to Stage
        run: kubectl apply -k k8s/overlays/stage/

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/ciyex-ehr-ui-stage --timeout=3m
          kubectl get pods -l app=ciyex-ehr-ui -o wide

  notify:
    name: Notify Team
    if: github.event_name != 'pull_request' && always()
    runs-on: [self-hosted, linux, x64]
    needs: [deploy-stage]

    steps:
      - name: Determine deployment status
        id: status
        run: |
          if [ "${{ needs.deploy-stage.result }}" == "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "emoji=✅" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "emoji=❌" >> $GITHUB_OUTPUT
          fi

      - name: Send Microsoft Teams notification
        run: |
          TEAMS_WEBHOOK="${{ secrets.TEAMS_WEBHOOK_URL }}"
          if [ -z "$TEAMS_WEBHOOK" ]; then
            echo "⚠️ TEAMS_WEBHOOK_URL secret not configured, skipping notification"
            exit 0
          fi

          STATUS_COLOR="28a745"
          if [ "${{ steps.status.outputs.status }}" == "failure" ]; then
            STATUS_COLOR="dc3545"
          fi

          curl -H "Content-Type: application/json" -d '{
            "@type": "MessageCard",
            "@context": "https://schema.org/extensions",
            "themeColor": "'"$STATUS_COLOR"'",
            "summary": "Ciyex EHR UI Stage Deployment ${{ steps.status.outputs.status }}",
            "sections": [{
              "activityTitle": "${{ steps.status.outputs.emoji }} Ciyex EHR UI Stage Deployment ${{ steps.status.outputs.status }}",
              "activitySubtitle": "Version ${{ env.VERSION }}",
              "facts": [
                {"name": "Environment:", "value": "Stage"},
                {"name": "Version:", "value": "${{ env.VERSION }}"},
                {"name": "Deployed by:", "value": "${{ github.actor }}"},
                {"name": "Commit:", "value": "${{ github.sha }}"},
                {"name": "URL:", "value": "https://stg.ciyex.com"}
              ],
              "markdown": true
            }],
            "potentialAction": [{
              "@type": "OpenUri",
              "name": "View Workflow",
              "targets": [{"os": "default", "uri": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}]
            }]
          }' "$TEAMS_WEBHOOK"
